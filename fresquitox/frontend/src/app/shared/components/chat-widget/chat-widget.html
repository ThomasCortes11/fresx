<!-- Botón flotante -->
<button class="cw-fab" [class.cw-fab--open]="abierto()" (click)="toggleChat()" aria-label="Chat de ayuda">
  @if (abierto()) {
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6 6 18M6 6l12 12"/></svg>
  } @else {
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
  }
</button>

<!-- Ventana del chat -->
@if (abierto()) {
  <div class="cw">

    <!-- Header -->
    <div class="cw__head">
      <div class="cw__avatar">F</div>
      <div class="cw__head-info">
        <span class="cw__bot-name">Asistente Fresquitox</span>
        <span class="cw__status">
          <span class="cw__status-dot"></span>
          En línea
        </span>
      </div>
      <button type="button" class="cw__clear" (click)="limpiar()" title="Limpiar chat">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/></svg>
      </button>
    </div>

    <!-- Mensajes -->
    <div class="cw__body" #chatBody>

      @for (m of mensajes(); track m.id) {
        <div class="cw__msg" [class.cw__msg--user]="m.role === 'user'" [class.cw__msg--bot]="m.role === 'bot'">
          @if (m.role === 'bot') {
            <div class="cw__msg-avatar">F</div>
          }
          <div class="cw__bubble">
            <span [innerHTML]="renderMarkdown(m.texto)"></span>
            @if (hasWA(m.texto)) {
              <button type="button" class="cw__wa-btn" (click)="irWhatsapp()">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413z"/></svg>
                Escribir por WhatsApp
              </button>
            }
          </div>
        </div>
      }

      @if (escribiendo()) {
        <div class="cw__msg cw__msg--bot">
          <div class="cw__msg-avatar">F</div>
          <div class="cw__bubble cw__bubble--typing">
            <span class="cw__dot"></span>
            <span class="cw__dot"></span>
            <span class="cw__dot"></span>
          </div>
        </div>
      }

    </div>

    <!-- Sugerencias -->
    @if (mostrarSugerencias() && !escribiendo()) {
      <div class="cw__suggestions">
        @for (s of sugerencias(); track s.id) {
          <button type="button" class="cw__chip" (click)="preguntarSugerida(s)">{{ s.pregunta }}</button>
        }
      </div>
    }

    <!-- Input -->
    <div class="cw__footer">
      <textarea class="cw__input" placeholder="Escribe tu pregunta…" rows="1"
        [value]="inputText()"
        (input)="inputText.set($any($event.target).value)"
        (keydown)="onKeydown($event)"></textarea>
      <button type="button" class="cw__send" [disabled]="!inputText().trim()" (click)="enviar()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </div>

  </div>
}
